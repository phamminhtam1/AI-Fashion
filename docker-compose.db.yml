# ==========================================================
# DATABASE SERVER DOCKER COMPOSE (VM2: db-server - 192.168.56.20)
# Dedicated PostgreSQL instance for production
#
# Usage:
#   docker compose --env-file .env.db -f docker-compose.db.yml up -d
# ==========================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: elane-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - elane_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  elane_pg_data:
    name: elane_pg_data
