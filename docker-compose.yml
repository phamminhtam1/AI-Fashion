# ==========================================================
# BASE DOCKER COMPOSE CONFIGURATION
# Defines shared network and common service identifiers
# Extend with:
#   - Development: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   - Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ==========================================================

services:
  api:
    container_name: elane-api
    networks:
      - elane_network

  storefront:
    container_name: elane-storefront
    networks:
      - elane_network

  admin:
    container_name: elane-admin
    networks:
      - elane_network

networks:
  elane_network:
    driver: bridge
