# ==========================================================
# DEVELOPMENT DOCKER COMPOSE OVERRIDE
# Single-machine local development environment:
# - Local PostgreSQL with healthcheck
# - Vite / TSX hot-reloading with bind mounts
# - Optional ngrok webhook tunnel
#
# Usage:
#   docker compose --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml up --build -d
# ==========================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: elane-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elane}
      POSTGRES_DB: ${POSTGRES_DB:-elane}
    ports:
      - "5432:5432"
    volumes:
      - elane_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elane} -d ${POSTGRES_DB:-elane}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - elane_network

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://elane:elane@postgres:5432/elane}
      SESSION_SECRET: ${SESSION_SECRET:-dev-change-me-elane-phase1-secret}
      API_PORT: "3001"
      API_HOST: "0.0.0.0"
      UPLOAD_DIR: /app/uploads
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_MEDIA_BUCKET: ${SUPABASE_MEDIA_BUCKET:-products}
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:-}
      SEPAY_BANK_ACCOUNT: ${SEPAY_BANK_ACCOUNT:-}
      SEPAY_ACCOUNT_NAME: ${SEPAY_ACCOUNT_NAME:-}
      SEPAY_BANK_NAME: ${SEPAY_BANK_NAME:-}
      SEPAY_BANK_BIN: ${SEPAY_BANK_BIN:-}
      STOREFRONT_ORIGIN: ${STOREFRONT_ORIGIN:-http://localhost:8090}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:8081}
      COOKIE_SECURE: "false"
      NODE_ENV: development
    ports:
      - "3001:3001"
    volumes:
      - elane_uploads:/app/uploads
      - ./apps/api:/app/apps/api
      - ./packages/db:/app/packages/db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  storefront:
    build:
      context: .
      dockerfile: docker/storefront.Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
      API_INTERNAL_URL: http://api:3001
      HOST: "0.0.0.0"
      PORT: "8090"
    ports:
      - "8090:8090"
    volumes:
      - ./apps/storefront:/app/apps/storefront
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
      API_INTERNAL_URL: http://api:3001
      HOST: "0.0.0.0"
      PORT: "8081"
    ports:
      - "8081:8081"
    volumes:
      - ./apps/admin:/app/apps/admin
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: elane-ngrok
    command: http api:3001 --log stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - elane_network

volumes:
  elane_pg:
  elane_uploads:
